<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concord Armchair - AR Viewer</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    model-viewer {
      width: 100%;
      height: 100vh;
      --poster-color: transparent;
    }

    #android-ar-button,
    #ios-ar-button {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffffff;
      color: #111111;
      border-radius: 24px;
      padding: 12px 24px;
      font-size: 15px;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      z-index: 10;
    }
  </style>
</head>
<body>

  <model-viewer
    id="viewer"
    src="concord_armchair.glb"
    alt="Concord Armchair"
    camera-controls
    disable-zoom
    camera-orbit="0deg 75deg 105%"
    min-camera-orbit="auto 55deg auto"
    max-camera-orbit="auto 100deg auto"
    shadow-intensity="1"
    exposure="1">
  </model-viewer>

  <!-- تصویر مخفی لازم برای فعال شدن صحیح iOS Quick Look -->
  <img id="ar-hidden-img" style="display:none;" src="concord_armchair.usdz" alt="">

  <!-- دکمه‌ی AR اندروید: لینک مستقیم Scene Viewer با قفل مقیاس -->
  <a id="android-ar-button"
     href="intent://arvr.google.com/scene-viewer/1.0?file=https://fatemehzn85-byte.github.io/concord-ar/concord_armchair.glb&mode=ar_preferred&resizable=false#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;S.browser_fallback_url=https://fatemehzn85-byte.github.io/concord-ar/concord_armchair.html;end;">
    مشاهده در فضای شما
  </a>

  <!-- دکمه‌ی AR آیفون: لینک مستقیم Quick Look با قفل مقیاس -->
  <a id="ios-ar-button"
     rel="ar"
     href="concord_armchair.usdz#allowsContentScaling=0">
    مشاهده در فضای شما
  </a>

  <script>
    // نمایش فقط دکمه‌ی مناسب بر اساس سیستم‌عامل کاربر
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

    document.getElementById('android-ar-button').style.display = isIOS ? 'none' : 'block';
    document.getElementById('ios-ar-button').style.display = isIOS ? 'block' : 'none';
  </script>

</body>
</html>
